<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>防災気象情報表示サービス</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var STORAGE_KEY = 'wx-viewer:color-mode';
        var setting = null;
        try {
          // storageが使えない(プライバシー設定等で例外)場合も、未設定として以降のOS設定判定は続行する
          setting = window.localStorage.getItem(STORAGE_KEY);
        } catch (e) {
          setting = null;
        }
        try {
          var dark =
            setting === 'dark' ||
            (setting !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.style.colorScheme = dark ? 'dark' : 'light';
          // DEFAULT_THEME_SEED(#1A73E8)のneutral paletteをtone 6(dark)/98(light)で
          // 事前計算した実値。シード変更時はこの値も合わせて更新すること。
          root.style.setProperty('--md-sys-color-background', dark ? '#121316' : '#faf9fd');
        } catch (e) {
          // matchMedia等が使えない場合はブラウザ既定のlightのまま描画する
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
